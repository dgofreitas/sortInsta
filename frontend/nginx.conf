server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Páginas legais públicas - proxy APENAS para estas rotas específicas
    # IMPORTANTE: Estas rotas TÊM PRIORIDADE sobre o React Router
    location = /privacy-policy-meta {
        proxy_pass http://backend:5000/api/auth/privacy-policy;

    }

    location = /terms-of-service-meta {
        proxy_pass http://backend:5000/api/auth/terms-of-service;
    }

    location = /data-deletion-callback {
        proxy_pass http://backend:5000/api/auth/data-deletion-callback;
    }

    location = /google-callback {
        proxy_pass http://localhost:5000/api/auth/google/callback;
    }

    location = /facebook-callback {
        proxy_pass http://localhost:5000/api/auth/facebook/callback;
    }

    location = /instagram-callback {
        proxy_pass http://localhost:5000/api/auth/instagram/callback;
    }

    # Service worker should not be cached (antes do location / para ter prioridade)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (antes do location / para ter prioridade)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend SPA - ÚLTIMA PRIORIDADE (catch-all)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
