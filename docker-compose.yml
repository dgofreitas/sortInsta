services:
  mongodb:
    image: mongo:latest
    container_name: sortinsta-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sortinsta
    networks:
      - sortinsta-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sortinsta-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/sortinsta
      FRONTEND_URL: http://localhost:3000
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - sortinsta-network
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sortinsta-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sortinsta-network

networks:
  sortinsta-network:
    driver: bridge

volumes:
  mongodb_data:
